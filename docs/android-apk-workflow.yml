# Android APK 빌드 워크플로우
#
# 주의: GitHub 커넥터 스냅샷 푸시는 .github/workflows/ 파일을 올릴 수 없다.
# 이 파일을 맥북에서 .github/workflows/android-apk.yml 로 복사한 뒤
# 커밋·푸시하면, 이후 main 푸시마다 Actions가 APK를 빌드한다.
# (작명별도 같은 방식으로 워크플로우를 관리한다.)

name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.x"
          channel: stable

      - name: 의존성 설치
        run: flutter pub get

      - name: 정적 분석
        run: flutter analyze

      - name: 테스트
        run: flutter test

      - name: APK 빌드
        run: flutter build apk --release

      - name: APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
